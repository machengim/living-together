services:
  postgres:
    image: postgres:16-alpine
    container_name: living-together-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-living_together}
      POSTGRES_USER: ${POSTGRES_USER:-living_together}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-living_together_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-living_together} -d ${POSTGRES_DB:-living_together}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
